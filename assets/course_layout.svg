<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Slalom Challenge course layout</title>
  <desc id="desc">Top-view schematic of an eleven-meter-wide road. Eight cones lie on the centerline at X equals 20 through 125 meters, spaced 15 meters apart. The required pass side alternates positive Y and negative Y. A finish line spans the road at X equals 145 meters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#047857"/></marker>
    <pattern id="finish" width="16" height="32" patternUnits="userSpaceOnUse"><rect width="16" height="32" fill="#ffffff"/><rect width="8" height="16" fill="#17263c"/><rect x="8" y="16" width="8" height="16" fill="#17263c"/></pattern>
    <g id="cone"><circle r="10" fill="#fff4e8" stroke="#f97316" stroke-width="2"/><path d="M 0 -7 L 7 6 H -7 Z" fill="#ea580c"/><path d="M -4 1 H 4" stroke="white" stroke-width="2"/></g>
  </defs>
  <rect width="1600" height="620" fill="#f5f8fc"/>
  <text x="72" y="62" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#17263c">Slalom Challenge: course and scoring geometry</text>
  <text x="74" y="96" font-family="Arial, sans-serif" font-size="19" fill="#475569">Top view · nominal course · axes are scaled independently for readability</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#334155">
    <rect x="72" y="116" width="342" height="43" rx="18" fill="#e6efff"/><text x="91" y="144">BMW E90 · TMeasy · road μ = 0.9</text>
    <rect x="429" y="116" width="301" height="43" rx="18" fill="#e3f6ec"/><text x="448" y="144">8 cones · 15 m center spacing</text>
    <rect x="744" y="116" width="294" height="43" rx="18" fill="#fff0df"/><text x="763" y="144">Road edges: Y = ±5.5 m</text>
  </g>
  <rect x="160" y="204" width="1350" height="220" fill="#e4eaf1" stroke="#64748b" stroke-width="2"/>
  <path d="M 160 314 H 1510" stroke="#a5b4c5" stroke-width="2" stroke-dasharray="20 12"/>
  <g stroke="#93a4ba" stroke-width="1" stroke-dasharray="4 8">
    <path d="M 340 204 V 424 M 475 204 V 424 M 610 204 V 424 M 745 204 V 424 M 880 204 V 424 M 1015 204 V 424 M 1150 204 V 424 M 1285 204 V 424"/>
  </g>
  <g fill="#34d399" opacity="0.26">
    <rect x="329" y="204" width="22" height="109"/><rect x="464" y="315" width="22" height="109"/>
    <rect x="599" y="204" width="22" height="109"/><rect x="734" y="315" width="22" height="109"/>
    <rect x="869" y="204" width="22" height="109"/><rect x="1004" y="315" width="22" height="109"/>
    <rect x="1139" y="204" width="22" height="109"/><rect x="1274" y="315" width="22" height="109"/>
  </g>
  <path d="M 160 204 V 424" stroke="#475569" stroke-width="4"/>
  <rect x="1458" y="204" width="16" height="220" fill="url(#finish)" stroke="#17263c" stroke-width="1.5"/>
  <g stroke="#047857" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 340 302 V 256"/><path d="M 610 302 V 256"/><path d="M 880 302 V 256"/><path d="M 1150 302 V 256"/>
    <path d="M 475 326 V 372"/><path d="M 745 326 V 372"/><path d="M 1015 326 V 372"/><path d="M 1285 326 V 372"/>
  </g>
  <g fill="#047857" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="340" y="241">+Y</text><text x="610" y="241">+Y</text><text x="880" y="241">+Y</text><text x="1150" y="241">+Y</text>
    <text x="475" y="395">−Y</text><text x="745" y="395">−Y</text><text x="1015" y="395">−Y</text><text x="1285" y="395">−Y</text>
  </g>
  <g>
    <use href="#cone" x="340" y="314"/><use href="#cone" x="475" y="314"/><use href="#cone" x="610" y="314"/><use href="#cone" x="745" y="314"/>
    <use href="#cone" x="880" y="314"/><use href="#cone" x="1015" y="314"/><use href="#cone" x="1150" y="314"/><use href="#cone" x="1285" y="314"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="340" y="192">Gate 1</text><text x="475" y="452">Gate 2</text><text x="610" y="192">Gate 3</text><text x="745" y="452">Gate 4</text>
    <text x="880" y="192">Gate 5</text><text x="1015" y="452">Gate 6</text><text x="1150" y="192">Gate 7</text><text x="1285" y="452">Gate 8</text>
    <text x="160" y="452">Start</text><text x="1466" y="192">Finish</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">
    <text x="160" y="478">0</text><text x="340" y="478">20</text><text x="475" y="478">35</text><text x="610" y="478">50</text><text x="745" y="478">65</text>
    <text x="880" y="478">80</text><text x="1015" y="478">95</text><text x="1150" y="478">110</text><text x="1285" y="478">125</text><text x="1466" y="478">145</text>
    <text x="1533" y="478" text-anchor="start">X (m)</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="end">
    <text x="148" y="209">+5.5</text><text x="148" y="319">0</text><text x="148" y="429">−5.5</text>
  </g>
  <path d="M 90 338 V 260" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="69" y="252" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">+Y</text>
  <rect x="72" y="518" width="1456" height="72" rx="14" fill="#ffffff" stroke="#d7e0ec"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155">
    <text x="95" y="547">At each cone X-plane, REF must cross on the indicated side of the cone centerline; no fixed lateral gate margin applies.</text>
    <text x="95" y="574">The green bands show valid REF crossing regions. Vehicle-footprint cone contact and road limits are checked separately.</text>
  </g>
</svg>
