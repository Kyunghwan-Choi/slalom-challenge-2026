<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">COM velocity, yaw rate, and front-wheel steering</title>
  <desc id="desc">Body-frame COM velocities vx and vy point forward and left. Yaw rate r is counterclockwise. Front-wheel angle delta is measured from body x to an extended line parallel to the wheel. Global position and heading are defined in the preceding coordinate figure.</desc>
  <defs>
    <marker id="body" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
    <marker id="velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
    <marker id="turn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
  </defs>
  <style>text{font-family:Arial,sans-serif;fill:#17263c}.title{font-size:31px;font-weight:700}.heading{font-size:20px;font-weight:700}.note{font-size:17px}.symbol{font-size:23px;font-weight:700}.body{fill:#7c3aed}.velocity{fill:#059669}.turn{fill:#b45309}</style>
  <rect width="1200" height="460" fill="#f6f9fd"/>
  <text x="48" y="55" class="title">COM motion and front-wheel steering</text>
  <text x="50" y="90" class="note">The preceding figure defines position and heading; this figure defines the remaining four states.</text>
  <rect x="40" y="115" width="548" height="289" rx="16" fill="#fff" stroke="#d5e0ee" stroke-width="2"/>
  <rect x="612" y="115" width="548" height="289" rx="16" fill="#fff" stroke="#d5e0ee" stroke-width="2"/>
  <text x="60" y="153" class="heading">COM velocity and yaw rate</text>
  <path d="M140 295 H535" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#body)"/>
  <path d="M140 295 V204" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#body)"/>
  <text x="516" y="324" class="note body">+x</text>
  <text x="113" y="193" class="note body">+y</text>
  <path d="M140 295 H425" fill="none" stroke="#059669" stroke-width="5" marker-end="url(#velocity)"/>
  <path d="M140 295 V230" fill="none" stroke="#059669" stroke-width="5" marker-end="url(#velocity)"/>
  <circle cx="140" cy="295" r="8" fill="#059669" stroke="#fff" stroke-width="2"/>
  <text x="104" y="326" class="note velocity">COM</text>
  <text x="303" y="279" class="symbol velocity">v<tspan baseline-shift="sub" font-size="16">x</tspan></text>
  <text x="161" y="253" class="symbol velocity">v<tspan baseline-shift="sub" font-size="16">y</tspan></text>
  <path d="M492 254 A44 44 0 1 0 410 225" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#turn)"/>
  <text x="423" y="178" class="symbol turn">r = ψ̇</text>
  <text x="60" y="369" class="note">v<tspan baseline-shift="sub" font-size="12">x</tspan>, v<tspan baseline-shift="sub" font-size="12">y</tspan>: m/s at COM; r: rad/s, positive counterclockwise.</text>
  <text x="632" y="153" class="heading">Front-wheel steering angle</text>
  <path d="M680 280 H1120" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#body)"/>
  <text x="1101" y="309" class="note body">+x</text>
  <path d="M740 311 L1006 193" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="780" y="185" class="note turn">Wheel direction</text>
  <g transform="rotate(-24 810 280)">
    <rect x="752" y="266" width="116" height="28" rx="8" fill="#344a64"/>
    <path d="M752 280 H868" stroke="#f3f7fd" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <path d="M900 280 A90 90 0 0 0 892.22 243.39" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="918" y="255" class="symbol turn">δ</text>
  <text x="632" y="369" class="note">δ: measured mean front-wheel angle from body +x (rad).</text>
  <text x="50" y="442" class="note">The dimensionless steering input u<tspan baseline-shift="sub" font-size="12">s</tspan> is a command; δ is a measured vehicle state.</text>
</svg>
